<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ReaCue Studio</title>
<link rel="stylesheet" href="reacue_studio/base.css">
<link rel="stylesheet" href="reacue_studio/travail.css">
</head>
<body class="rc">
<div class="rc-app">
  <header class="rc-top">
    <div class="rc-brand">
      <div class="rc-logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16181B" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M3 12h3l2.5-7 4 14 2.5-7h6"/></svg></div>
      <span class="rc-word">REACUE</span>
    </div>
    <nav class="rc-nav" id="nav" aria-label="Modes">
      <button data-mode="biblio" class="soon" data-t="navBiblio">BIBLIO</button>
      <button data-mode="travail" class="on" data-t="navTravail">TRAVAIL</button>
      <button data-mode="groupe" class="soon" data-t="navGroupe">GROUPE</button>
      <button data-mode="concert" class="soon" data-t="navConcert">CONCERT</button>
      <button data-mode="lumiere" class="soon" data-t="navLumiere">LUMIÈRE</button>
    </nav>
    <button class="rc-lang" id="langBtn" aria-label="Langue / Language">EN</button>
    <div class="rc-lcds" aria-live="off">
      <div class="rc-lcd"><div class="k" data-t="lPos">POSITION</div><div class="v" id="lcdPos">---.-.-</div></div>
      <div class="rc-lcd"><div class="k" data-t="lTime">TEMPS</div><div class="v" id="lcdTime">00:00.00</div></div>
      <div class="rc-lcd"><div class="k" data-t="lTempo">TEMPO</div><div class="v"><span id="lcdTempo">—</span> <small id="lcdRate">100 %</small></div></div>
      <div class="rc-lcd"><div class="k" data-t="lKey">TON</div><div class="v"><span id="lcdKey">—</span> <small id="lcdTr">±0</small></div></div>
      <div class="rc-lcd tc"><div class="k">SMPTE</div><div class="v" id="lcdTc">00:00:00:00</div></div>
    </div>
  </header>

  <main id="travail" class="tv">
    <section class="tv-head">
      <div class="tv-title">
        <h1 class="rc-h1" id="title">—</h1>
        <span class="rc-meta" id="meta"></span>
      </div>
      <div class="tv-tools">
        <label class="tv-me"><span data-t="me">MON INSTRUMENT</span>
          <select class="rc-select" id="meSel"><option value="" data-t="meNone">— aucun —</option></select></label>
        <div class="tv-tr" id="trBox">
          <span class="rc-label" data-t="trLabel">TON</span>
          <button class="rc-btn sm" id="trDown" aria-label="-1">−</button>
          <button class="rc-btn sm" id="trUp" aria-label="+1">+</button>
        </div>
        <button class="rc-btn sm sig" id="expBtn" data-t="export">EXPORTER</button>
      </div>
    </section>

    <section class="tv-ruler rc-inset" id="ruler">
      <div class="tv-secs" id="secs"></div>
      <div class="tv-chords" id="chords"></div>
      <div class="tv-loop" id="rulerLoop" hidden></div>
      <div class="tv-head-line" id="rulerHead" aria-hidden="true"></div>
    </section>

    <div class="tv-body">
      <section class="tv-stems rc-inset" id="stems" aria-label="Stems">
        <div class="rc-empty" id="stemsEmpty" data-t="waiting">Connexion à REAPER…</div>
      </section>
      <section class="tv-console rc-inset" id="console" aria-label="Console"></section>
    </div>
  </main>

  <footer class="rc-foot">
    <div class="rc-group">
      <button class="rc-btn" id="bHome" data-tt="tHome" aria-label="Début"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6l-8 6 8 6M6 6v12"/></svg></button>
      <button class="rc-btn" id="bStop" data-tt="tStop" aria-label="Stop"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
      <button class="rc-btn play" id="bPlay" data-tt="tPlay" aria-label="Lecture"><svg id="icPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg><svg id="icPause" hidden width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button class="rc-btn" id="bLoop" data-tt="tLoop" aria-label="Boucle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg></button>
      <button class="rc-btn" id="bNext" data-tt="tNext" aria-label="Section suivante"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l8 6-8 6M18 6v12"/></svg></button>
    </div>
    <div class="rc-group tv-chips">
      <span class="rc-chip" id="cLoop">—</span>
      <button class="rc-chip" id="cRamp">—</button>
      <button class="rc-chip" id="cClick">CLICK ON</button>
      <button class="rc-chip" id="cVoice">VOIX ON</button>
    </div>
    <div class="rc-leds" style="margin-left:auto">
      <span class="rc-led" id="ledReaper"><i></i>REAPER</span>
      <span class="rc-led" id="ledPrompt"><i></i><span data-t="ledPrompt">PROMPTEUR</span></span>
      <span class="rc-led" id="ledLtc"><i></i>LTC</span>
    </div>
  </footer>
</div>

<!-- export -->
<div class="rc-veil" id="expVeil">
  <div class="rc-pop" role="dialog" aria-labelledby="expH">
    <h2 id="expH" data-t="expTitle">EXPORTER</h2>
    <h3 data-t="expStems">INSTRUMENTS</h3>
    <div class="rc-row" id="expStems"></div>
    <div class="rc-row" style="margin-top:6px">
      <button class="rc-btn sm" id="expAll" data-t="all">TOUS</button>
      <button class="rc-btn sm" id="expNone" data-t="none">AUCUN</button>
      <label class="rc-check"><input type="checkbox" id="expClick"><span data-t="withClick">avec le click</span></label>
    </div>
    <h3 data-t="expRange">RÉGION</h3>
    <div class="rc-row">
      <label class="rc-check"><input type="radio" name="rng" value="song" checked><span data-t="rSong">morceau entier</span></label>
      <label class="rc-check"><input type="radio" name="rng" value="section"><span data-t="rSection">section</span></label>
      <select class="rc-select" id="expSection"></select>
    </div>
    <div class="rc-row" style="margin-top:6px">
      <label class="rc-check"><input type="radio" name="rng" value="bars"><span data-t="rBars">mesures</span></label>
      <input class="rc-input num" id="expFrom" type="number" min="1" value="1" aria-label="de">
      <span>→</span>
      <input class="rc-input num" id="expTo" type="number" min="1" value="8" aria-label="à">
      <label class="rc-check"><input type="radio" name="rng" value="selection"><span data-t="rSel">sélection REAPER</span></label>
    </div>
    <h3 data-t="expMode">FICHIERS</h3>
    <div class="rc-row">
      <label class="rc-check"><input type="radio" name="mode" value="separate" checked><span data-t="mSep">un fichier par instrument</span></label>
      <label class="rc-check"><input type="radio" name="mode" value="mix"><span data-t="mMix">tout mixé en un fichier</span></label>
    </div>
    <h3 data-t="expFormat">FORMAT</h3>
    <div class="rc-row">
      <label class="rc-check"><input type="radio" name="fmt" value="mp3" checked><span>MP3</span></label>
      <select class="rc-select" id="expKbps"><option>128</option><option>192</option><option>256</option><option selected>320</option></select>
      <span class="rc-note">kbit/s</span>
      <label class="rc-check"><input type="radio" name="fmt" value="wav"><span>WAV 24 bits</span></label>
    </div>
    <div class="rc-row" style="margin-top:16px">
      <button class="rc-btn sm sig" id="expGo" data-t="expGo">EXPORTER</button>
      <button class="rc-btn sm" id="expClose" data-t="close">FERMER</button>
      <div class="rc-bar" style="flex:1;min-width:80px"><i id="expProg"></i></div>
    </div>
    <p class="rc-note" id="expMsg"></p>
    <div class="rc-files" id="expFiles"></div>
  </div>
</div>

<!-- rampe de vitesse -->
<div class="rc-veil" id="rampVeil">
  <div class="rc-pop" role="dialog" aria-labelledby="rampH" style="width:min(420px,100%)">
    <h2 id="rampH" data-t="rampTitle">RAMPE DE VITESSE</h2>
    <p class="rc-note" data-t="rampHelp"></p>
    <div class="rc-row">
      <span data-t="rampFrom">de</span><input class="rc-input num" id="rFrom" type="number" min="50" max="100" step="1" value="85"><span>%</span>
      <span data-t="rampTo">à</span><input class="rc-input num" id="rTo" type="number" min="50" max="100" step="1" value="100"><span>%</span>
    </div>
    <div class="rc-row" style="margin-top:8px">
      <span data-t="rampN">en</span><input class="rc-input num" id="rN" type="number" min="2" max="32" step="1" value="8"><span data-t="rampPasses">passages</span>
    </div>
    <p class="rc-note" id="rampSec"></p>
    <div class="rc-row" style="margin-top:12px">
      <button class="rc-btn sm sig" id="rGo" data-t="rampGo">LANCER</button>
      <button class="rc-btn sm" id="rOff" data-t="rampOff">ARRÊTER</button>
      <button class="rc-btn sm" id="rClose" data-t="close">FERMER</button>
    </div>
  </div>
</div>

<!-- PIN de la fenêtre ReaCue -->
<div class="rc-veil" id="pinVeil">
  <div class="rc-pop" role="dialog" aria-labelledby="pinH" style="width:min(360px,100%)">
    <h2 id="pinH">PIN</h2>
    <p class="rc-note" data-t="pinHelp"></p>
    <div class="rc-row">
      <input class="rc-input num" id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" style="width:110px;font-size:18px">
      <button class="rc-btn sm sig" id="pinOk">OK</button>
      <button class="rc-btn sm" id="pinCancel" data-t="cancel">ANNULER</button>
    </div>
    <p class="rc-note bad" id="pinErr"></p>
  </div>
</div>

<div class="rc-toast" id="toast"></div>
<script src="reacue_studio/core.js"></script>
<script src="reacue_studio/travail.js"></script>
</body>
</html>
