<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16181B">
<meta name="color-scheme" content="dark">
<title>ReaCue Prompteur</title>
<!-- style « Studio pro » : base commune de ReaCue Studio (polices embarquées, jetons de couleur, afficheurs LCD) -->
<link rel="stylesheet" href="reacue_studio/base.css">
<style>
  /* Prompteur des musiciens, lisible sur scène : très gros caractères, contrastes ≥ 4.5:1, cibles ≥ 44 px.
     Les jetons (--bg, --panel, --inset, --sig, --led, --lcd…) viennent de base.css ; repli si le fichier manque. */
  :root {
    --bg: #16181B; --panel: #1E2125; --inset: #0F1113; --well: #121417; --edge: #0C0D0F; --raise: #2B2F35;
    --ink: #E6E8EB; --ink2: #B4BAC2; --mute: #8A9099; --mute2: #9AA0A8;
    --sig: #FF8A3D; --led: #3BE37A; --lcd: #F2C230; --smpte: #8FD1FF; --red: #FF4D4D; --note: #E58FB5;
    --cell: #22262B; --cell-past: #1B1E22; --on-sig: #16181B;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", var(--sans);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body.pr { font-family: var(--sans); font-size: 16px; -webkit-user-select: none; user-select: none; overflow: hidden;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; gap: 8px;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .k, .klab { font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
  .cond { font-family: var(--cond); font-weight: 700; letter-spacing: .02em; }

  /* en-tête : titre + n° du morceau, état du stem, rôle, langue, plein écran, liaison REAPER ------------------- */
  .top { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 2px; }
  .title { flex: 1; min-width: 0; font-family: var(--cond); font-size: 24px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
  .title b { font-weight: 700; }
  .title .rk { color: var(--mute2); font-weight: 600; margin-left: 4px; }
  .role { min-height: 44px; padding: 0 12px; border-radius: 4px; background: var(--raise); border: 1px solid var(--edge);
    font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; flex: none; }
  .iconbtn { width: 44px; height: 44px; flex: none; border-radius: 4px; border: 1px solid var(--edge); background: var(--well);
    color: var(--ink2); font-size: 13px; font-weight: 600; letter-spacing: .06em; padding: 0; }
  .iconbtn.on { color: var(--led); border-color: var(--led); }
  /* « Prêt » (répétition, écran GROUPE de ReaCue Studio) : discret, vert quand il est allumé */
  .ready { min-height: 44px; padding: 0 10px; border-radius: 4px; background: var(--well); border: 1px solid var(--edge);
    color: var(--mute2); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; flex: none; }
  .ready.on { color: var(--edge); background: var(--led); border-color: var(--led); }
  .ready.wait { color: var(--led); border-color: var(--led); }
  .pname { font-size: 18px; min-height: 52px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--edge); background: var(--inset);
    color: var(--ink); margin-bottom: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); flex: none; margin: 0 2px; }
  .dot.on { background: var(--led); box-shadow: 0 0 8px var(--led); }
  .stem { flex: 0 1 auto; min-width: 0; font-size: 14px; font-weight: 700; border-radius: 4px; padding: 6px 10px; display: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stem.show { display: inline-block; }
  .stem.on { border: 1px solid var(--led); color: var(--led); }
  .stem.off { background: var(--lcd); color: var(--on-sig); border: 1px solid var(--lcd); }

  /* afficheurs LCD : mesure, tempo, ton (reacue_studio/base.css .rc-lcds) ------------------------------------- */
  body.pr .rc-lcds { margin: 0; width: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); flex: none;
    background: var(--edge); border: 1px solid var(--edge); border-radius: 6px; overflow: hidden; gap: 1px; }
  body.pr .rc-lcd { text-align: left; padding: 6px 12px 7px; min-width: 0; background: var(--inset); }
  body.pr .rc-lcd .k { font-size: 11px; letter-spacing: .14em; }
  body.pr .rc-lcd .v { font-family: var(--mono); font-size: clamp(24px, 7vw, 40px); line-height: 1.1; color: var(--lcd);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  body.pr .rc-lcd .v small { display: inline; font-size: .45em; color: var(--mute2); margin-left: 3px; }

  /* carte de la section en cours : nom, mesure dans la section, voyants de temps, progression ------------------- */
  .now { flex: none; background: var(--panel); border: 1px solid var(--edge); border-top: 5px solid var(--sig); border-radius: 6px; padding: 8px 14px 12px; }
  .now .label { display: flex; justify-content: space-between; gap: 8px; }
  .now .label span:last-child { font-family: var(--mono); letter-spacing: .04em; text-transform: none; color: var(--mute2); }
  .now .r2 { display: flex; align-items: baseline; gap: 10px; }
  .now .name { flex: 1; min-width: 0; font-family: var(--cond); font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
    font-size: clamp(44px, 13vw, 104px); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .spos { flex: none; font-family: var(--mono); font-size: clamp(18px, 5vw, 30px); color: var(--mute2); font-variant-numeric: tabular-nums; }
  .beats { display: flex; gap: 5px; margin-top: 10px; }
  .beats span { flex: 1; height: 16px; border-radius: 3px; background: var(--raise); }
  .beats span.on { background: var(--led); box-shadow: 0 0 8px var(--led); }
  .progress { height: 4px; background: var(--edge); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--ink2); width: 0; }

  /* accord en cours (carte claire) + suivant, grille de la section --------------------------------------------- */
  .side { display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: 0 1 auto; overflow-y: auto; }
  .sidea, .sideb { display: flex; flex-direction: column; gap: 8px; flex: none; }
  .chords { display: none; flex-direction: column; gap: 8px; }
  .chords.show { display: flex; }
  .head2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; }
  .ccard { border-radius: 6px; padding: 8px 14px 10px; min-width: 0; }
  .ccard.cur { background: var(--ink); color: var(--bg); }
  .ccard.cur .k { color: #3F444B; }
  .ccard.nx { background: var(--panel); border: 1px solid var(--edge); }
  .chords .cur .v { font-family: var(--cond); font-weight: 700; font-size: clamp(64px, 21vw, 150px); line-height: .95;
    white-space: nowrap; overflow: hidden; }
  .chords .cur .v small { font-family: var(--sans); font-size: .26em; font-weight: 600; margin-left: 8px; color: #3F444B; letter-spacing: 0; }
  .chords .nx b { display: block; font-family: var(--cond); font-weight: 700; font-size: clamp(44px, 13vw, 100px); line-height: 1.05;
    color: var(--mute2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chords .nx span { display: block; font-family: var(--mono); font-size: 14px; color: var(--ink2); }
  .chords .nx.soon b { color: var(--sig); }
  .chords .nx.soon span { color: var(--sig); }
  .cgrid { background: var(--inset); border: 1px solid var(--edge); border-radius: 6px; padding: 7px 8px 8px; }
  .cgrid .k { margin: 0 0 5px 2px; display: flex; justify-content: space-between; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; font-family: var(--mono); }
  .grid4 div { background: var(--cell); color: var(--ink); border-radius: 3px; padding: 4px 7px 6px; font-size: clamp(16px, 4.6vw, 24px);
    font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid4 div i { font-style: normal; display: block; font-size: 11px; color: var(--mute2); font-weight: 500; line-height: 1.2; }
  .grid4 div.past { background: var(--cell-past); color: var(--mute); }
  .grid4 div.doubt { color: var(--mute2); font-style: italic; }
  .grid4 div.here { background: var(--sig); color: var(--on-sig); }
  .grid4 div.here i { color: var(--on-sig); }

  /* note de section ---------------------------------------------------------------------------------------- */
  .snote { display: none; background: var(--panel); border: 1px solid var(--edge); border-left: 5px solid var(--note); border-radius: 6px;
    padding: 9px 12px; font-size: clamp(17px, 4.6vw, 24px); line-height: 1.35; }
  .snote.show { display: block; }
  .snote b { color: var(--note); font-weight: 700; letter-spacing: .06em; }

  /* paroles : ligne en cours (mot surligné), suivante, compte à rebours avant l'entrée ----------------------------- */
  .lyr { display: none; background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 10px 14px 12px; }
  .lyr.show { display: block; }
  .lyr .prev { font-size: clamp(16px, 4.2vw, 24px); color: var(--mute); min-height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lyr .line { font-size: clamp(30px, 8.4vw, 64px); font-weight: 700; line-height: 1.12; margin: 4px 0 6px; }
  .lyr .line.wait { color: var(--ink2); }
  .lyr .line.ready { color: var(--sig); }
  /* calage mot par mot : mots déjà chantés estompés, mot en cours surligné */
  .lyr .line .wd.done { color: var(--mute2); }
  .lyr .line .wd.now { color: var(--sig); text-decoration: underline; text-decoration-thickness: .08em; text-underline-offset: .12em; }
  .lyr .sweep { height: 5px; background: var(--edge); border-radius: 3px; overflow: hidden; }
  .lyr .sweep i { display: block; height: 100%; width: 0; background: var(--led); }
  .lyr .nextl { font-size: clamp(19px, 5.2vw, 34px); font-weight: 600; color: var(--ink2); margin-top: 8px; }
  .lyr .when { font-family: var(--mono); font-size: 14px; color: var(--mute2); display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .lyr .when b { color: var(--sig); font-size: clamp(20px, 5.4vw, 30px); }

  /* alertes du rôle (entrées, sorties, solo, break…) --------------------------------------------------------- */
  .alerts { display: flex; flex-direction: column; gap: 6px; }
  .alert { border-radius: 6px; padding: 7px 12px; background: var(--panel); border: 1px solid var(--edge); border-left: 6px solid var(--raise);
    font-family: var(--cond); font-size: clamp(26px, 7vw, 46px); font-weight: 700; letter-spacing: .02em; line-height: 1.05; }
  .alert small { display: block; font-family: var(--sans); font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--ink2); margin-top: 2px; }
  .alert.play { border-left-color: var(--led); color: var(--led); }
  .alert.rest { color: var(--ink2); }
  .alert.soon { border-left-color: var(--lcd); color: var(--lcd); }
  .alert.now, .alert.imm { background: var(--sig); color: var(--on-sig); border-color: var(--sig); }
  .alert.now small, .alert.imm small { color: var(--on-sig); }
  .alert.stop { border-left-color: var(--red); color: var(--red); }
  .alert.info { font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--ink2); letter-spacing: 0; line-height: 1.35; }

  /* plan : liste des sections, ENSUITE / DANS n mes, mini-structure --------------------------------------------- */
  .map { display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: 1 0 auto; justify-content: flex-end; }
  .list { display: none; flex: 1 1 0; min-height: 0; overflow-y: auto; font-size: 17px; }
  .list.show { display: block; }
  .list .row { display: flex; gap: 10px; padding: 6px 8px; border-radius: 4px; align-items: center; color: var(--ink2); }
  .list .row.cur { background: var(--panel); color: var(--ink); font-weight: 700; }
  .list .row i { width: 6px; height: 22px; border-radius: 2px; flex: none; }
  .list .row .b { margin-left: auto; color: var(--mute2); font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
  .next { display: flex; align-items: stretch; gap: 1px; background: var(--edge); border: 1px solid var(--edge); border-radius: 6px; overflow: hidden; flex: none; }
  .next .box { flex: 1; min-width: 0; background: var(--panel); padding: 7px 12px 9px; border-left: 5px solid var(--raise); }
  .next .box .v { font-family: var(--cond); font-weight: 700; letter-spacing: .02em; text-transform: uppercase; font-size: clamp(30px, 8.6vw, 60px);
    line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .next .count { flex: none; min-width: clamp(104px, 28vw, 200px); background: var(--inset); padding: 7px 12px 9px; text-align: right; }
  .next .count .v { font-family: var(--mono); font-size: clamp(34px, 10vw, 72px); line-height: 1.05; color: var(--sig); font-variant-numeric: tabular-nums; }
  .next .count .v small { font-size: 14px; color: var(--mute2); margin-left: 4px; }
  .next.last .count { background: var(--sig); }
  .next.last .count .v, .next.last .count .v small, .next.last .count .k { color: var(--on-sig); }
  .strip { position: relative; display: flex; gap: 2px; height: 44px; padding: 14px 0; flex: none; cursor: pointer; }
  .strip div { height: 100%; border-radius: 2px; opacity: .5; min-width: 2px; }
  .strip div.cur { opacity: 1; box-shadow: inset 0 0 0 2px var(--ink); }
  .strip .head { position: absolute; top: 9px; bottom: 9px; height: auto; width: 3px; background: var(--ink); border-radius: 1px; padding: 0; opacity: 1; box-shadow: 0 0 6px #000; min-width: 0; }
  .foot { display: flex; justify-content: space-between; gap: 10px; color: var(--mute2); font-family: var(--mono); font-size: 12px; margin-top: -6px; flex: none; white-space: nowrap; }
  .foot span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .foot span:last-child { flex: 0 1 auto; }

  /* vue batteur : section, temps, carrures, prochain événement, grille du groove ---------------------------------- */
  #drum { display: none; flex-direction: column; gap: 8px; min-height: 0; flex: 1 1 auto; overflow-y: auto; }
  body.drummer #drum { display: flex; }
  body.drummer #now, body.drummer #next, body.drummer #list, body.drummer #footR,
  body.drummer .sidea, body.drummer #alerts { display: none !important; }
  body.drummer .map { flex: none; }
  .dhead { display: flex; gap: 8px; align-items: stretch; }
  .dsec { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--edge); border-top: 5px solid var(--sig); border-radius: 6px; padding: 7px 14px 10px; }
  .dsec .v { font-family: var(--cond); font-weight: 700; letter-spacing: .02em; text-transform: uppercase; font-size: clamp(38px, 11vw, 84px);
    line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dsec .g { font-size: 15px; color: var(--ink2); margin-top: 3px; }
  .dcount { flex: none; width: clamp(110px, 30vw, 200px); background: var(--inset); border: 1px solid var(--edge); border-radius: 6px; text-align: right; padding: 7px 12px; display: flex; flex-direction: column; justify-content: center; }
  .dcount .v { font-family: var(--mono); font-size: clamp(40px, 12vw, 88px); line-height: 1; color: var(--lcd); font-variant-numeric: tabular-nums; }
  .dcount .v small { font-size: .45em; color: var(--mute2); }
  .dcount .k { text-transform: none; letter-spacing: .02em; font-weight: 500; margin-top: 4px; }
  .dbeats { display: flex; gap: 6px; }
  .dbeats span { flex: 1; height: clamp(44px, 11vw, 64px); border-radius: 4px; background: var(--raise); display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: clamp(20px, 5.6vw, 32px); font-weight: 600; color: var(--mute2); }
  .dbeats span.on { background: var(--led); color: var(--on-sig); box-shadow: 0 0 10px var(--led); }
  .dbeats span.one.on { background: var(--sig); box-shadow: 0 0 10px var(--sig); }
  .phrase { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; }
  .phrase div { height: 34px; border-radius: 3px; background: var(--cell); font-family: var(--mono); font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; color: var(--ink2); border: 2px solid transparent; }
  .phrase div.past { background: var(--cell-past); color: var(--mute); }
  .phrase div.here { background: var(--ink); color: var(--on-sig); }
  .phrase div.fill { border-color: var(--sig); color: var(--sig); }
  .phrase div.here.fill { background: var(--sig); color: var(--on-sig); }
  .phrase div.rest { background: repeating-linear-gradient(45deg, #1B1E22 0 6px, #2B2F35 6px 12px); color: var(--ink2); }
  .phrase div.crash::after { content: "✱"; margin-left: 2px; color: var(--smpte); }
  .devent { background: var(--panel); border: 1px solid var(--edge); border-left: 6px solid var(--raise); border-radius: 6px; padding: 7px 14px 9px; }
  .devent .v { font-family: var(--cond); font-weight: 700; letter-spacing: .02em; font-size: clamp(32px, 9vw, 64px); line-height: 1.05; }
  .devent .k { text-transform: none; letter-spacing: .02em; font-size: 15px; font-weight: 500; color: var(--ink2); margin-top: 2px; }
  .devent.soon { border-left-color: var(--lcd); } .devent.soon .v { color: var(--lcd); }
  .devent.imm { background: var(--sig); border-color: var(--sig); color: var(--on-sig); } .devent.imm .k { color: var(--on-sig); }
  .devent.stop { border-left-color: var(--red); } .devent.stop .v { color: var(--red); }
  .dthen { font-size: 15px; color: var(--ink2); padding: 0 4px; }
  .dgrid { background: var(--inset); border: 1px solid var(--edge); border-radius: 6px; padding: 8px 10px 10px; }
  .dgrid .t { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .dgrid .t span:last-child { color: var(--mute2); font-weight: 500; font-family: var(--mono); font-size: 13px; }
  .dgrid.isfill { box-shadow: inset 0 0 0 3px var(--sig); }
  .dgrid.isfill .t span:first-child { color: var(--sig); }
  .lanes { display: grid; grid-template-columns: 74px repeat(16, 1fr); row-gap: 4px; align-items: center; }
  .lanes .lb { font-size: 13px; color: var(--ink2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lanes .c { height: 26px; display: flex; align-items: center; justify-content: center; border-left: 1px solid #ffffff10; }
  .lanes .c.b { border-left: 2px solid #ffffff30; }
  .lanes .c.cur { background: #ffffff1c; }
  .lanes .c i { width: 15px; height: 15px; border-radius: 50%; background: var(--ink); display: block; }
  .lanes .c i.acc { width: 20px; height: 20px; }
  .lanes .c.cur i { background: var(--sig); }
  .lanes .c i.cy { background: var(--smpte); transform: rotate(45deg); border-radius: 3px; }
  .lanes .c i.cy.op { background: transparent; border: 3px solid var(--smpte); box-sizing: border-box; }
  .lanes .c i.bd { background: #FF7A7A; }
  .lanes .c i.sd { background: #fff; }
  .lanes .c i.tm { background: #C9A0FF; }
  .lanes .hd { font-family: var(--mono); font-size: 11px; color: var(--mute2); text-align: center; height: 16px; }

  /* choix du rôle, PIN, messages --------------------------------------------------------------------------------- */
  .picker { position: fixed; inset: 0; background: rgba(12, 13, 15, .97); display: none; flex-direction: column; justify-content: center;
    padding: 20px; gap: 8px; z-index: 10; overflow-y: auto; }
  .picker.show { display: flex; }
  .picker h1 { margin: 0 0 6px; font-family: var(--cond); font-size: 32px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .picker button { font-size: 22px; font-weight: 700; padding: 12px 16px; min-height: 56px; border-radius: 6px; border: 1px solid var(--edge);
    background: var(--panel); color: var(--ink); text-align: left; box-shadow: inset 0 1px 0 var(--raise); }
  .picker button small { display: block; font-size: 14px; font-weight: 400; color: var(--ink2); margin-top: 2px; }
  .msg { position: fixed; left: 12px; right: 12px; bottom: 12px; background: var(--red); color: #fff; padding: 12px 14px; border-radius: 6px;
    font-size: 16px; font-weight: 600; display: none; z-index: 5; }
  .msg.show { display: block; }

  /* régie (télécommande du concert) ------------------------------------------------------------------------------- */
  #regie { display: none; flex-direction: column; gap: 8px; min-height: 0; flex: 1; overflow-y: auto; }
  body.regie #regie { display: flex; }
  body.regie #now, body.regie #next, body.regie .side, body.regie #drum, body.regie .map { display: none !important; }
  .rhead { background: var(--panel); border: 1px solid var(--edge); border-top: 5px solid var(--sig); border-radius: 6px; padding: 8px 14px 10px; }

const SP = { rate: 1, tr: 0, raw: null };
let lcdKey = "";

}

// ---------------------------------------------------------------- présence et « Prêt » (écran GROUPE de ReaCue Studio)
// Toutes les ~2 s, le prompteur écrit ReaCue/hb<0-7> = id|rôle|nom|prêt|époque (emplacement tiré de son identifiant :
// plusieurs téléphones n'écrivent presque jamais au même endroit ; un battement perdu est repris au suivant). La
// fenêtre ReaCue les lit, les oublie après 10 s et publie ReaCue/band = époque|… ; une remise à zéro change
// d'époque : le « Prêt » de ce téléphone s'éteint.
var BAND = { cid: load("reacue_cid"), ready: load("reacue_ready") === "1", epoch: load("reacue_ready_epoch") || "",
  known: "", next: 0, confirmed: false };
if (!/^[a-z0-9]{6,16}$/.test(BAND.cid || "")) { BAND.cid = Math.random().toString(36).slice(2, 10).padEnd(8, "0"); store("reacue_cid", BAND.cid); }
BAND.slot = [...BAND.cid].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % 8;
const isMusician = () => !!role && role !== "regie" && role !== "light";
function paintReady() {
  if (typeof BAND === "undefined" || !BAND) return;
  const b = $("readyBtn"); b.hidden = DEMO || !isMusician();
  b.textContent = BAND.ready ? S.readyOn : S.readyB;
  b.classList.toggle("on", BAND.ready && BAND.confirmed); b.classList.toggle("wait", BAND.ready && !BAND.confirmed);
}
function beatValue() {
  const name = encodeURIComponent((load("reacue_name") || "").slice(0, 24));
  return `${BAND.cid}|${role || ""}|${name}|${BAND.ready && isMusician() ? 1 : 0}|${BAND.ready ? BAND.epoch : ""}`;
}
// à ajouter à la prochaine interrogation de REAPER ; now = tout de suite (appui sur « Prêt », changement de rôle)
function beat(now) { BAND.next = now ? 0 : BAND.next; }
function beatQuery(t) {
  let q = "";
  if (t >= BAND.next) {
    q += ";SET/EXTSTATE/ReaCue/hb" + BAND.slot + "/" + encodeURIComponent(beatValue());
    BAND.next = t + 1600 + Math.random() * 800;
  }
  if (!BAND.readAt || t - BAND.readAt > 900) { BAND.readAt = t; q += ";GET/EXTSTATE/ReaCue/band"; }
  return q;
}
function bandReply(txt) {
  const v = extVal(txt, "band");
  if (v == null) return;
  const epoch = v.split("|")[0] || "";
  if (epoch && BAND.known && epoch !== BAND.known && BAND.ready) {     // remise à zéro depuis ReaCue Studio
    BAND.ready = false; store("reacue_ready", "0");
  }
  if (epoch) BAND.known = epoch;
  if (epoch && BAND.ready && BAND.epoch !== epoch) { BAND.epoch = epoch; store("reacue_ready_epoch", epoch); beat(true); }
  const me = v.slice(epoch.length + 1).split(";").find(e => e.split(",")[0] === BAND.cid);
  BAND.confirmed = !!me && me.split(",")[3] === "1";
  paintReady();
}
$("readyBtn").onclick = () => {
  BAND.ready = !BAND.ready; store("reacue_ready", BAND.ready ? "1" : "0");
  if (BAND.ready) { BAND.epoch = BAND.known; store("reacue_ready_epoch", BAND.known); }
  BAND.confirmed = false; paintReady(); beat(true);
  setTimeout(() => beat(true), 300 + Math.random() * 400);         // second envoi (téléphones simultanés)
};

// afficheurs : mesure.temps, tempo (× vitesse de lecture), ton (transposé)
function renderLcds(L) {

  if ($("lcdBar").textContent !== bar) $("lcdBar").textContent = bar;

  const r = SP.rate || 1, shown = song.tempo_mode === "constant" && Math.abs(r - 1) < 0.001 ? Math.round(bpm * 10) / 10 : Math.round(bpm * r);
  const k = shown + "|" + r + "|" + SP.tr + "|" + (song.key ? song.key.chord : "") + "|" + LANG;
  if (k === lcdKey) return;

  $("lcdBpm").innerHTML = `${shown}${Math.abs(r - 1) > 0.001 ? `<small>${Math.round(r * 100)} %</small>` : ""}`;
  $("lcdKey").innerHTML = song.key ? `${esc(nice(tc(song.key.chord)))}${SP.tr ? `<small>${SP.tr > 0 ? "+" : ""}${SP.tr}</small>` : ""}` : "—";
}

function alerts(L, si, sec, nxt, left) {

  const bar = L.bar, r = instrRole();

      } else out.push(["play", S.youPlay, off ? S.nextRest(off) : S.toEnd]);
    } else {

        const cls = n <= 1 ? "imm" : n <= 2 ? "soon" : "rest";
        const big = n <= 1 ? S.entryIn(L.beat >= 0 ? song.beats_per_bar - L.beat : null) : S.entryBars(inBars(n));
        out.push([cls, big, `${S.instr[role] || ""} · ${where}`]);
      } else out.push(["rest", S.youStop, S.toSongEnd]);
    }
  }

  // spécifique au rôle
  const nt = nxt ? nxt.type : null;
  if (role === "drums") {
    if (left === 1 && !stopping) out.push(["now", nxt ? `FILL → ${nxt.name}` : S.end, ""]);
    else if (nt === "break" && left <= 4) out.push(["soon", S.breakIn(inBars(left)), S.breakLen(mes(nxt.end_bar - nxt.start_bar + 1))]);
    if (sec && sec.type === "break") out.push(["stop", S.breakNow, S.backTo(nxt ? nxt.name : S.endLower, inBars(left))]);
  }
  if (role === "lead_guitar") {
    if (sec && sec.type === "solo") out.push([left <= 2 ? "now" : left <= 4 ? "soon" : "play", left <= 4 ? S.lastRound : S.solo, S.soloEnds(inBars(left))]);
    else { const s = song.sections.find(x => x.type === "solo" && x.start_bar > bar);
      if (s && s.start_bar - bar <= 8) out.push([s.start_bar - bar <= 2 ? "now" : "soon", S.soloIn(inBars(s.start_bar - bar)), mes(s.end_bar - s.start_bar + 1)]); }
  }
  if (role === "vocals" && !has) out.push(["info", S.noVoiceStem, ""]);

  // infos de fond
  // tonalité : dans l'afficheur TON ; rappelée ici quand il n'y a pas de grille d'accords
  if ((role === "bass" || role === "guitars" || role === "lead_guitar") && song.key && !(song.chords && song.chords.length))
    out.push(["info", S.key(SP.tr ? nice(tc(song.key.chord)) : `${keyName(song.key)} (${song.key.chord})`) + S.noChords, ""]);
  if (role === "vocals" && !(song.lyrics && song.lyrics.length)) out.push(["info", S.noLyrics, ""]);
  if (!has && role !== "vocals" && role !== "all" && Object.keys(song.activity).length === 0)
    out.push(["info", S.noStems, ""]);
  return out;
}

  document.querySelectorAll("#rReh .rx").forEach(b => { b.style.display = rh.on ? "" : "none"; });
  $("rLoopOff").textContent = S.rLoopOff;
  document.querySelectorAll("#rReh button.rate").forEach(b => {
    b.textContent = S.rRate(+b.dataset.rate); b.classList.toggle("on", rh.on && Math.abs(rh.rate - b.dataset.rate) < 0.001);
  });
  $("rRehB").textContent = rh.on ? S.rRehBanner(rh.names, rh.rate) : "";
  $("rRehB").classList.toggle("show", rh.on);
  $("rSecsT").textContent = rh.on ? S.rSecsReh : S.rSecs;
  // setlist
  const kl = concert ? concert.id : "";
  if (kl !== rKeyList) {
    rKeyList = kl;
    $("rListT").style.display = concert ? "" : "none";
    $("rList").innerHTML = concert ? concert.songs.map((s, i) => {
      const c = (s.sections.find(x => x.color && x.color.toLowerCase() !== "#787878") || s.sections[0] || {}).color || "#888";
      return `<button data-k="${i}"><i style="background:${c}"></i><span class="n">${i + 1}</span>${esc(s.title)}<span class="b">${Math.round(s.bpm)} BPM · ${mmss(s.stop_t - s.start_t)}</span></button>`;
    }).join("") : "";
    $("rList").querySelectorAll("button").forEach(b => b.onclick = () => {
      if (!confirmTap("song" + b.dataset.k, b)) return;
      sendCmd("song", +b.dataset.k + 1, b);
    });
  }
  $("rList").querySelectorAll("button").forEach(b => b.classList.toggle("cur", +b.dataset.k === cIdx));
  // délais / fenêtre Concert fermée
  for (const [n, p] of Object.entries(rg.pending)) if (now - p.at > 2500) {
    delete rg.pending[n]; p.el && p.el.classList.remove("sent");
    rWarn(S.rNoAnswer, true);
  }
  if (!DEMO && st.ok && (!rg.alive || now - rg.aliveAt > 3000) && !$("rWarn").classList.contains("bad"))
    rWarn(S.rOpenWin);
  else if (!DEMO && rg.alive && now - rg.aliveAt <= 3000 && $("rWarn").textContent === S.rOpenWin)
    rWarn("");
  if (!concert && !$("rWarn").classList.contains("show")) rWarn(S.rNoConcertHint);
  const pin = pinGet(); $("rFootL").textContent = pin ? S.rPin(pin) : S.rNoPin;
}

// ---------------------------------------------------------------- lumière (cues grandMA3)
let lKey = "";
// même calcul que l'export (lighting.seconds_to_smpte) : HH:MM:SS:FF, non drop-frame
function smpte(sec, fps) {
  sec = Math.max(0, sec);
  const tf = Math.round(sec * fps), fr = tf % Math.round(fps), ts = Math.floor(tf / fps);
  const p = v => String(Math.floor(v)).padStart(2, "0");
  return `${p(Math.floor(ts / 3600))}:${p(Math.floor(ts / 60) % 60)}:${p(ts % 60)}:${p(fr)}`;
}
function lightData() { return concert ? concert.lighting : song && song.lighting; }
function renderLight(t) {
  if (role !== "light") return;
  const D = lightData(), cues = (D && D.cues) || [];
  $("lNone").style.display = cues.length ? "none" : "";
  const key = (concert ? concert.id : song.id) + ":" + LANG + ":" + cues.length;
  if (key !== lKey) {
    lKey = key;
    let html = "", prev = null;
    cues.forEach((c, i) => {
      if (concert && c.track !== prev) { prev = c.track; html += `<div class="song">${c.track + 1} · ${esc(c.song)}</div>`; }
      html += `<div class="row" data-i="${i}"><span class="n">${c.n}</span><span class="tc">${esc(c.tc)}</span>` +
        `<span class="nm">${esc(c.name)}</span><span class="ef">${esc(c.type_label[LANG] || "")} · ${esc(c.effect[LANG] || "")}</span></div>`;
    });
    $("lCues").innerHTML = html;
    const kinds = { sequence: S.lSeq, timecode: S.lTc, csv: S.lCsv };
    $("lFiles").innerHTML = ((D && D.files) || []).map(f =>
      `<a href="${esc(encodeURI(f.url))}" download="${esc(f.name)}">${esc(kinds[f.kind] || f.kind)}<small>${esc(f.name)}</small></a>`).join("");
    $("lFilesT").style.display = D && D.files && D.files.length ? "" : "none";
    const O = D && D.timecode;
    $("lOutT").style.display = $("lOut").style.display = O ? "" : "none";
    $("lOut").innerHTML = O ? [[O.ltc, S.lLtc(O.ltc)], [O.mtc, S.lMtc(O.mtc)]].map(([on, x]) =>
        `<div class="o${on ? "" : " off"}">${on ? "<b>●</b>" : "○"}<span>${esc(x)}</span></div>`).join("") +
      `<div class="o"><b>#</b><span>${esc(S.lSlotTc(O.slot || 1))}</span></div>` +
      `<ol>${S.lHow(O.slot || 1).map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : "";
    $("lCfg").textContent = D ? S.lCfg(D.fps, D.tc_start) + (D.slot_s ? S.lSlot(D.slot_s) : "") + (D.gap_s != null ? S.lGap(D.gap_s) : "") : "";
  }
  const fps = D ? D.fps : 25, off = D ? D.offset_s : 0;
  $("lTc").textContent = smpte(off + Math.max(0, t), fps);
  let ci = -1;
  for (let i = 0; i < cues.length; i++) if (cues[i].t <= t + 0.02) ci = i;
  const cur = cues[ci], nx = cues[ci + 1];
  $("lCurV").textContent = cur ? cur.name : (cues.length ? S.lBefore : "—");
  $("lCurN").textContent = cur ? `${concert ? (cur.track + 1) + " · " : ""}cue ${cur.n}` : "";
  $("lCurE").textContent = cur ? cur.effect[LANG] || "" : "";
  const secC = cur && song.sections.find(s => s.name === cur.name);
  $("lCur").style.borderTopColor = secC ? secC.color : "var(--raise)";
  $("lNext").innerHTML = nx ? `${esc(S.lNext(nx.n, nx.name))}<small>${esc(nx.tc)} · ${esc(nx.effect[LANG] || "")}</small>` : (cues.length ? esc(S.lLast) : "");
  const left = nx ? nx.t - t : null;
  $("lCntV").textContent = left == null ? "–" : mmss(left);
  $("lCnt").classList.toggle("soon", left != null && left <= 5);
  document.querySelectorAll("#lCues .row").forEach(r => { const i = +r.dataset.i;
    r.classList.toggle("cur", i === ci); r.classList.toggle("past", i < ci); });
  if (ci !== renderLight.last) { renderLight.last = ci;
    const r = document.querySelector(`#lCues .row[data-i="${ci}"]`), box = $("lCues");
    if (r) box.scrollTo({ top: Math.max(0, r.offsetTop - box.clientHeight / 2 + r.offsetHeight / 2), behavior: "smooth" }); }
}

function showMsg(t) { $("msg").textContent = t; $("msg").classList.add("show"); }
function hideMsg() { $("msg").classList.remove("show"); }

// ---------------------------------------------------------------- boucles
document.documentElement.lang = LANG;
applyStatic();
loadSong(); setInterval(loadSong, 2000);
(async function loop() { await poll(); setTimeout(loop, 80); })();
setInterval(() => { if (!DEMO && !st.ok && song) showMsg(S.noReaper); else if (song) hideMsg(); }, 1000);
layoutBeats(); requestAnimationFrame(render);

function focusLabel() {
  const on = document.body.classList.contains("stage-view");
  const button = $("focusBtn");
  button.textContent = LANG === "fr" ? (on ? "DÉTAILS" : "SCÈNE") : (on ? "DETAILS" : "STAGE");
  button.setAttribute("aria-pressed", String(on));
  button.title = LANG === "fr" ? "Affichage épuré pour la scène / détails" : "Focused stage display / details";
}
document.body.classList.toggle("stage-view", load("reacue_prompt_stage") === "1");
$("focusBtn").onclick = () => {
  const on = document.body.classList.toggle("stage-view");
  store("reacue_prompt_stage", on ? "1" : "0");
  focusLabel(); window.dispatchEvent(new Event("resize"));
};
focusLabel();
</script>
