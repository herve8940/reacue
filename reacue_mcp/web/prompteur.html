<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d10">
<title>ReaCue Prompteur</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #15191f; --line: #262c35; --ink: #f2f4f7; --dim: #8a94a3;
    --ok: #3ddc84; --warn: #ffb020; --hot: #ff4d4f; --sec: #3c78dc; --next: #888;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom)); gap: 10px; }

  /* barre du haut */
  .top { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--dim); min-height: 34px; }
  .role { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 999px;
    padding: 6px 14px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title b { color: var(--ink); font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--hot); flex: none; }
  .dot.on { background: var(--ok); }
  .iconbtn { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; padding: 5px 9px; font-size: 14px; }
  .iconbtn.on { color: var(--ok); border-color: var(--ok); }

  /* section en cours */
  .now { position: relative; border-radius: 18px; background: var(--panel); padding: 14px 18px 16px;
    border-left: 12px solid var(--sec); overflow: hidden; }
  .now .label { font-size: 14px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; }
  .now .name { font-size: clamp(38px, 11vw, 96px); font-weight: 800; line-height: 1.02; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { height: 8px; background: var(--line); border-radius: 4px; margin-top: 12px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--sec); width: 0; }
  .beats { display: flex; gap: 10px; margin-top: 12px; }
  .beats span { flex: 1; height: 22px; border-radius: 6px; background: var(--line); }
  .beats span.on { background: var(--ink); }
  .beats span.one.on { background: var(--warn); }

  /* prochain changement */
  .next { display: flex; align-items: stretch; gap: 10px; }
  .next .box { flex: 1; background: var(--panel); border-radius: 16px; padding: 10px 16px; border-left: 8px solid var(--next); min-width: 0; }
  .next .box .k { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .next .box .v { font-size: clamp(26px, 7vw, 54px); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .next .count { flex: none; width: clamp(110px, 30vw, 220px); background: var(--panel); border-radius: 16px; text-align: center; padding: 6px 8px; display: flex; flex-direction: column; justify-content: center; }
  .next .count .v { font-size: clamp(44px, 14vw, 110px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .next .count .k { font-size: 13px; color: var(--dim); }
  .next.last .count { background: var(--warn); color: #000; }
  .next.last .count .k { color: #000; }

  /* alertes du rôle */
  .side { display: flex; flex-direction: column; gap: 10px; }
  .alerts { display: flex; flex-direction: column; gap: 8px; }
  .alert { border-radius: 14px; padding: 10px 16px; font-size: clamp(20px, 5.5vw, 40px); font-weight: 800; background: var(--panel); border: 2px solid var(--line); }
  .alert small { display: block; font-size: 14px; font-weight: 500; color: var(--dim); }
  .alert.play { border-color: var(--ok); color: var(--ok); }
  .alert.rest { border-color: var(--line); color: var(--dim); }
  .alert.soon { border-color: var(--warn); color: var(--warn); }
  .alert.now, .alert.imm { background: var(--warn); color: #000; border-color: var(--warn); }
  .alert.now small, .alert.imm small { color: #000; }
  .alert.stop { border-color: var(--hot); color: var(--hot); }
  .alert.info { font-size: 16px; font-weight: 500; color: var(--dim); }

  /* accords */
  .chords { background: var(--panel); border-radius: 16px; padding: 10px 14px 12px; display: none; }
  .chords.show { display: block; }
  .chords .head2 { display: flex; align-items: flex-end; gap: 14px; }
  .chords .cur { font-size: clamp(56px, 18vw, 130px); font-weight: 900; line-height: 1; letter-spacing: -.02em; }
  .chords .cur small { font-size: .38em; color: var(--dim); font-weight: 700; margin-left: 8px; letter-spacing: 0; }
  .chords .nx { margin-left: auto; text-align: right; color: var(--dim); font-size: 14px; }
  .chords .nx b { display: block; color: var(--ink); font-size: clamp(30px, 9vw, 60px); font-weight: 800; line-height: 1.05; }
  .chords .nx.soon b { color: var(--warn); }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
  .grid4 div { background: var(--bg); border-radius: 7px; padding: 5px 6px; font-size: clamp(15px, 4.2vw, 22px); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 2px solid transparent; }
  .grid4 div i { font-style: normal; display: block; font-size: 10px; color: var(--dim); font-weight: 500; }
  .grid4 div.here { border-color: var(--warn); }
  .grid4 div.past { opacity: .4; }
  .grid4 div.doubt { color: var(--dim); }

  /* paroles */
  .lyr { background: var(--panel); border-radius: 16px; padding: 12px 16px 14px; display: none; }
  .lyr.show { display: block; }
  .lyr .prev { font-size: clamp(15px, 4vw, 22px); color: var(--dim); opacity: .55; min-height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lyr .line { font-size: clamp(26px, 7.5vw, 58px); font-weight: 800; line-height: 1.12; margin: 4px 0; }
  .lyr .line.wait { color: var(--dim); }
  .lyr .line.ready { color: var(--warn); }
  /* calage mot par mot : mots déjà chantés estompés, mot en cours surligné */
  .lyr .line .wd.done { color: var(--dim); }
  .lyr .line .wd.now { color: var(--warn); text-decoration: underline; text-decoration-thickness: .08em; text-underline-offset: .12em; }
  .lyr .sweep { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .lyr .sweep i { display: block; height: 100%; width: 0; background: var(--ok); }
  .lyr .nextl { font-size: clamp(18px, 5vw, 32px); font-weight: 600; color: var(--dim); margin-top: 8px; }
  .lyr .when { font-size: 14px; color: var(--dim); display: flex; justify-content: space-between; margin-top: 2px; }
  .lyr .when b { color: var(--warn); font-size: 18px; }

  /* vue batteur */
  #drum { display: none; flex-direction: column; gap: 10px; min-height: 0; }
  body.drummer #drum { display: flex; }
  body.drummer #now, body.drummer #next, body.drummer .side, body.drummer #list, body.drummer #footR { display: none !important; }
  .dhead { display: flex; gap: 10px; align-items: stretch; }
  .dsec { flex: 1; min-width: 0; background: var(--panel); border-radius: 16px; padding: 10px 14px; border-left: 12px solid var(--sec); }
  .dsec .k { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .dsec .v { font-size: clamp(30px, 9vw, 72px); font-weight: 900; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dsec .g { font-size: 15px; color: var(--dim); margin-top: 2px; }
  .dcount { flex: none; width: clamp(110px, 30vw, 200px); background: var(--panel); border-radius: 16px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .dcount .v { font-size: clamp(44px, 13vw, 100px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .dcount .v small { font-size: .45em; color: var(--dim); }
  .dcount .k { font-size: 13px; color: var(--dim); }
  .dbeats { display: flex; gap: 8px; }
  .dbeats span { flex: 1; height: clamp(34px, 9vw, 60px); border-radius: 10px; background: var(--line); display: flex; align-items: center; justify-content: center; font-size: clamp(18px, 5vw, 30px); font-weight: 900; color: #0008; }
  .dbeats span.on { background: var(--ink); color: #000; }
  .dbeats span.one.on { background: var(--warn); }
  .phrase { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .phrase div { height: 30px; border-radius: 6px; background: var(--line); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; color: var(--dim); border: 2px solid transparent; }
  .phrase div.past { background: #39414d; color: #9aa3b0; }
  .phrase div.here { background: var(--ink); color: #000; }
  .phrase div.fill { border-color: var(--warn); color: var(--warn); }
  .phrase div.here.fill { background: var(--warn); color: #000; }
  .phrase div.rest { background: repeating-linear-gradient(45deg, #1b2027 0 6px, #262c35 6px 12px); color: var(--dim); }
  .phrase div.crash::after { content: "✱"; margin-left: 2px; color: #7fd1ff; }
  .dgrid { background: var(--panel); border-radius: 16px; padding: 10px 12px 12px; }
  .dgrid .t { display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; margin-bottom: 6px; }
  .dgrid .t span:last-child { color: var(--dim); font-weight: 500; }
  .dgrid.isfill { box-shadow: inset 0 0 0 3px var(--warn); }
  .dgrid.isfill .t span:first-child { color: var(--warn); }
  .lanes { display: grid; grid-template-columns: 74px repeat(16, 1fr); row-gap: 4px; align-items: center; }
  .lanes .lb { font-size: 13px; color: var(--dim); font-weight: 700; white-space: nowrap; }
  .lanes .c { height: 26px; display: flex; align-items: center; justify-content: center; border-left: 1px solid #ffffff10; }
  .lanes .c.b { border-left: 2px solid #ffffff30; }
  .lanes .c.cur { background: #ffffff1c; }
  .lanes .c i { width: 15px; height: 15px; border-radius: 50%; background: var(--ink); display: block; }
  .lanes .c i.acc { width: 20px; height: 20px; }
  .lanes .c.cur i { background: var(--warn); }
  .lanes .c i.cy { background: #7fd1ff; transform: rotate(45deg); border-radius: 3px; }
  .lanes .c i.cy.op { background: transparent; border: 3px solid #7fd1ff; box-sizing: border-box; }
  .lanes .c i.bd { background: #ff7a7a; }
  .lanes .c i.sd { background: #fff; }
  .lanes .c i.tm { background: #c9a0ff; }
  .lanes .hd { font-size: 11px; color: var(--dim); text-align: center; height: 16px; }
  .devent { background: var(--panel); border-radius: 16px; padding: 10px 16px; border: 3px solid var(--line); }
  .devent .v { font-size: clamp(26px, 7.5vw, 54px); font-weight: 900; line-height: 1.1; }
  .devent .k { font-size: 15px; color: var(--dim); margin-top: 2px; }
  .devent.soon { border-color: var(--warn); } .devent.soon .v { color: var(--warn); }
  .devent.imm { background: var(--warn); border-color: var(--warn); color: #000; } .devent.imm .k { color: #000; }
  .devent.stop { border-color: var(--hot); } .devent.stop .v { color: var(--hot); }
  .dthen { font-size: 15px; color: var(--dim); padding: 0 6px; }
  @media (orientation: landscape) and (min-width: 700px) {
    body.drummer { grid-template-columns: 1fr 1.15fr; }
    body.drummer #drum { grid-column: 1 / -1; grid-row: 2 / 4; display: grid; grid-template-columns: 1fr 1.15fr; grid-auto-rows: min-content; column-gap: 14px; }
    body.drummer .dhead, body.drummer .dbeats, body.drummer .phrase, body.drummer .devent, body.drummer .dthen { grid-column: 1; }
    body.drummer .dgrid { grid-column: 2; grid-row: 1 / span 5; align-self: start; }
    .lanes .c { height: 34px; }
  }

  /* plan du morceau */
  .map { margin-top: auto; display: flex; flex-direction: column; min-height: 0; flex: 1; justify-content: flex-end; }
  .strip { position: relative; display: flex; height: 34px; border-radius: 8px; overflow: hidden; background: var(--line); }
  .strip div { height: 100%; border-right: 2px solid var(--bg); font-size: 11px; color: #000; font-weight: 700; padding: 2px 3px; overflow: hidden; white-space: nowrap; opacity: .55; }
  .strip div.cur { opacity: 1; }
  .strip .head { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #fff; border: none; padding: 0; opacity: 1; box-shadow: 0 0 6px #000; }
  .list { display: none; order: -1; margin-bottom: 8px; flex: 1 1 0; min-height: 0; overflow-y: auto; font-size: 17px; }
  .list.show { display: block; }
  .list .row { display: flex; gap: 10px; padding: 6px 8px; border-radius: 8px; align-items: center; }
  .list .row.cur { background: var(--panel); font-weight: 800; }
  .list .row i { width: 10px; height: 22px; border-radius: 3px; flex: none; }
  .list .row .b { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
  .foot { display: flex; justify-content: space-between; color: var(--dim); font-size: 13px; margin-top: 6px; }

  /* choix du rôle */
  .picker { position: fixed; inset: 0; background: rgba(5,6,8,.97); display: none; flex-direction: column; justify-content: center; padding: 24px; gap: 12px; z-index: 10; }
  .picker.show { display: flex; }
  .picker h1 { margin: 0 0 8px; font-size: 26px; }
  .picker button { font-size: 24px; font-weight: 700; padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-align: left; }
  .picker button small { display: block; font-size: 14px; font-weight: 400; color: var(--dim); margin-top: 2px; }
  .msg { position: fixed; left: 14px; right: 14px; bottom: 14px; background: var(--hot); color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 15px; display: none; z-index: 5; }
  .msg.show { display: block; }

  /* régie (télécommande du concert) */
  #regie { display: none; flex-direction: column; gap: 10px; min-height: 0; flex: 1; overflow-y: auto; }
  body.regie #regie { display: flex; }
  body.regie #now, body.regie #next, body.regie .side, body.regie #drum, body.regie .map { display: none !important; }
  .rhead { background: var(--panel); border-radius: 16px; padding: 10px 14px 12px; border-left: 12px solid var(--sec); }
  .rhead .r1 { display: flex; align-items: center; gap: 10px; }
  .rhead .rk { font-size: 14px; color: var(--dim); }
  .rhead .rt { font-size: clamp(26px, 7.5vw, 48px); font-weight: 900; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .rhead .rs { font-size: 16px; color: var(--dim); margin-top: 4px; }
  .rhead .rs b { color: var(--ink); }
  .rstate { flex: none; font-size: 14px; font-weight: 800; border-radius: 999px; padding: 5px 12px; border: 2px solid #777; color: #bbb; }
  .rstate.play { border-color: var(--ok); color: var(--ok); }
  .rstate.pause { border-color: var(--warn); color: var(--warn); }
  .rprog { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .rprog i { display: block; height: 100%; width: 0; background: var(--sec); }
  .rbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .rbtns button { font: inherit; color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    padding: 12px 4px; font-size: 15px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .rbtns button .ic { font-size: clamp(26px, 8vw, 40px); line-height: 1; font-weight: 900; }
  .rbtns button.big { grid-column: span 2; background: #1d9e75; border-color: #1d9e75; color: #fff; }
  .rbtns button.armed { background: var(--warn); border-color: var(--warn); color: #000; }
  .rbtns button.sent { opacity: .65; }
  .rbtns button.done { box-shadow: 0 0 0 3px var(--ok) inset; }
  .rreh { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .rreh button { font: inherit; color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
    padding: 8px 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .rreh button.on { background: var(--warn); border-color: var(--warn); color: #000; }
  .rreh button.sent { opacity: .65; }
  .rreh button.done { box-shadow: 0 0 0 3px var(--ok) inset; }
  .rreh .rate { min-width: 56px; }
  .rrehb { border-radius: 12px; padding: 8px 12px; font-size: 15px; font-weight: 800; background: var(--warn); color: #000; display: none; }
  .rrehb.show { display: block; }
  .rsecs button.inloop { box-shadow: inset 0 -5px 0 var(--warn); }
  .rmix { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .rmix button { font: inherit; color: #111; border: 3px solid transparent; border-radius: 12px; padding: 8px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 15px; font-weight: 800; }
  .rmix button small { font-size: 12px; font-weight: 600; }
  .rmix button.cut { opacity: .35; text-decoration: line-through; }
  .rmix button.solo { border-color: #fff; }
  .rmix button.sent { filter: brightness(.7); }
  .rmix button.armed { outline: 4px solid var(--warn); }
  .rmix button.done { box-shadow: 0 0 0 3px var(--ok); }
  .rmixb { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .rmixb button { font: inherit; color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
    padding: 8px 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .rmixb button.on { background: var(--warn); border-color: var(--warn); color: #000; }
  .rmixb span { color: var(--dim); font-size: 13px; }
  .stem { flex: none; font-size: 13px; font-weight: 800; border-radius: 999px; padding: 4px 10px; display: none; }
  .stem.show { display: inline-block; }
  .stem.on { border: 2px solid var(--ok); color: var(--ok); }
  .stem.off { background: var(--warn); color: #000; border: 2px solid var(--warn); }
  /* téléphone : titre sur deux lignes au besoin, sans la tonalité (affichée dans la page) */
  @media (max-width: 560px) {
    .title { white-space: normal; font-size: 13px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; }
    .title .tkey { display: none; }
  }
  /* téléphone : l'état du stem prend la place du titre, qui passe sur sa propre ligne (pas « 2… ») */
  @media (max-width: 560px) {
    .top:has(.stem.show) { flex-wrap: wrap; row-gap: 4px; }
    .top:has(.stem.show) .stem { margin-right: auto; }
    .top:has(.stem.show) .title { order: 9; flex-basis: 100%; font-size: 14px; }
  }
  .rtitle { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
  .rsecs { display: flex; flex-wrap: wrap; gap: 6px; }
  .rsecs button { font: inherit; font-size: 15px; font-weight: 700; color: #111; border: 3px solid transparent; border-radius: 10px; padding: 8px 10px; cursor: pointer; opacity: .8; }
  .rsecs button.cur { opacity: 1; border-color: #fff; }
  .rsecs button.done { box-shadow: 0 0 0 3px var(--ok); }
  .rlist button { font: inherit; width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: none; color: var(--ink);
    border: none; border-radius: 10px; padding: 9px 8px; font-size: 17px; cursor: pointer; }
  .rlist button.cur { background: var(--panel); font-weight: 800; }
  .rlist button.armed { background: var(--warn); color: #000; }
  .rlist button i { width: 8px; height: 22px; border-radius: 3px; flex: none; }
  .rlist button .n { color: var(--dim); width: 22px; font-variant-numeric: tabular-nums; }
  .rlist button .b { margin-left: auto; color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
  .rlist button.armed .n, .rlist button.armed .b { color: #000; }
  .rwarn { border-radius: 12px; padding: 10px 14px; font-size: 16px; font-weight: 700; background: var(--warn); color: #000; display: none; }
  .rwarn.show { display: block; }
  .rwarn.bad { background: var(--hot); color: #fff; }
  .rfoot { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 13px; padding-bottom: 6px; }
  .rfoot button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; padding: 5px 9px; font-size: 13px; }
  .pinbox { position: fixed; inset: 0; background: rgba(5,6,8,.96); display: none; flex-direction: column; justify-content: center; align-items: stretch; padding: 24px; gap: 14px; z-index: 12; }
  .pinbox.show { display: flex; }
  .pinbox h2 { margin: 0; font-size: 24px; }
  .pinbox p { margin: 0; color: var(--dim); font-size: 15px; }
  .pinbox input { font-size: 40px; font-weight: 800; letter-spacing: .4em; text-align: center; padding: 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); }
  .pinbox .row { display: flex; gap: 10px; }
  .pinbox button { flex: 1; font-size: 20px; font-weight: 700; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }

  @media (orientation: landscape) and (min-width: 700px) {
    body { display: grid; grid-template-columns: 1.25fr 1fr; grid-template-rows: auto auto minmax(0, 1fr); column-gap: 14px; }

    .next { grid-column: 1; grid-row: 3; align-self: start; }
    .side { grid-column: 2; grid-row: 2; }
    .map { grid-column: 2; grid-row: 3; margin-top: 0; padding-top: 4px; }
    .strip { display: none; }
    .foot { display: none; }
    body.regie { display: flex; }
  }

  if (!STR[l]) return;
  LANG = l; S = STR[l];

  document.documentElement.lang = l;
  applyStatic();

function applyStatic() {
  $("langBtn").textContent = LANG === "fr" ? "EN" : "FR";

// ---------------------------------------------------------------- position REAPER
async function poll() {
  if (DEMO) return;
  const t = performance.now();
  try {
    let q = "/_/TRANSPORT";
    if (role && role !== "all") q += ";GET/EXTSTATE/ReaCue/mix";
    if (role === "regie") {
      q += ";GET/EXTSTATE/ReaCue/remote_alive;GET/EXTSTATE/ReaCue/remote_ack;GET/EXTSTATE/ReaCue/rehearsal";
      if (t - rg.seenAt > 3000) { rg.seenAt = t; q += ";SET/EXTSTATE/ReaCue/remote_seen/" + rg.sid + "-" + (++rg.seenN); }
    }
    const r = await fetch(q, { cache: "no-store" });
    const txt = await r.text();
    const now = performance.now();
    if (role === "regie") regieReply(txt, now);
    mixReply(txt);
    const f = txt.split("\n").find(l => l.startsWith("TRANSPORT"));
    if (!f) throw new Error("bad answer");
    const p = f.split("\t");
    const play = parseInt(p[1], 10), pos = parseFloat(p[2]);
    const rtt = now - t; st.rtt = st.rtt * 0.8 + rtt * 0.2;
    const playing = play === 1 || play === 5;
    const measured = pos + (playing ? st.rtt / 2000 : 0);
    const predicted = st.play ? st.pos + (now - st.at) / 1000 : st.pos;
    // lissage : petites corrections progressives, grands écarts = saut (déplacement du curseur)
    const target = (playing && Math.abs(measured - predicted) < 0.06) ? predicted + (measured - predicted) * 0.25 : measured;
    st = { ...st, play: playing ? 1 : 0, ps: play, pos: target, at: now, ok: true, lastOk: now };
  } catch (e) { st.ok = false; }
}

  const v = $("pinIn").value.trim();
  if (!/^\d{4}$/.test(v)) { $("pinErr").textContent = S.pin4; return; }
  store("reacue_pin", v); $("pinBox").classList.remove("show"); rWarn("");
  const q = rg.queued; rg.queued = null;
  if (q) sendCmd(q.cmd, q.arg, q.el);
};
$("pinIn").addEventListener("keydown", e => { if (e.key === "Enter") $("pinOk").onclick(); });
$("pinIn").addEventListener("input", () => { $("pinErr").textContent = ""; });
$("pinCancel").onclick = () => { rg.queued = null; $("pinBox").classList.remove("show"); };
$("rPinBtn").onclick = () => askPin();
document.querySelectorAll(".rbtns button").forEach(b => b.onclick = () => {
  if (b.dataset.confirm && !confirmTap(b.id, b)) return;
  sendCmd(b.dataset.cmd, "", b);
});
$("rRehBtn").onclick = () => sendCmd("reh", rg.reh.on ? "0" : "1", $("rRehBtn"));
$("rLoopOff").onclick = () => sendCmd("loopoff", "", $("rLoopOff"));
document.querySelectorAll("#rReh button.rate").forEach(b => b.onclick = () => sendCmd("rate", b.dataset.rate, b));
const mmss = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
function renderRegie(t, L, si, sec) {
  if (role !== "regie") return;
  const now = performance.now();
  // état / en-tête
  const ps = DEMO ? 1 : st.ps, state = ps === 1 || ps === 5 ? "play" : ps === 2 || ps === 6 ? "pause" : "stop";
  const stEl = $("rState"); stEl.textContent = S.rState[state]; stEl.className = "rstate " + state;
  $("rRank").textContent = concert ? `${cIdx + 1} / ${concert.songs.length}` : "";
  $("rTitle").textContent = song.title;
  const t0 = concert ? song.start_t : barT(1 - song.count_in_bars), t1 = concert ? song.stop_t : barT(song.n_bars + 1);
  const where = sec ? sec.name : (!L.pre && !L.end && L.bar <= 0) ? (state === "play" ? S.rWhere.count : S.rWhere.ready) : L.end ? S.rWhere.end : S.rWhere.ready;
  const bar = L.bar >= 1 && L.bar <= song.n_bars ? S.rBar(L.bar, song.n_bars) : "";
  $("rSub").innerHTML = `<b>${esc(where)}</b>${esc(bar + S.rRest(mmss(t1 - Math.max(t, t0))))}` +
    esc(concert ? (song.next_title ? S.thenSong(song.next_title) : S.lastSong) : "");
  $("rHead").style.borderLeftColor = sec ? sec.color : "#555";
  $("rProg").style.width = `${Math.max(0, Math.min(100, 100 * (t - t0) / (t1 - t0)))}%`;
  $("rProg").style.background = sec ? sec.color : "var(--sec)";
  $("rPlayIc").textContent = state === "play" ? "❚❚" : "▶"; $("rPlayTx").textContent = state === "play" ? S.rPause : S.rPlay;
  // double appui : boutons armés
  if (rg.armed && now - rg.armed.t >= 2000) rg.armed = null;
  document.querySelectorAll(".rbtns button[data-confirm], .rlist button").forEach(b => {
    const a = !!(rg.armed && rg.armed.el === b);
    b.classList.toggle("armed", a);
    const lab = b.querySelector("span:last-child");
    if (b.closest(".rbtns") && lab) { if (!b.dataset.lab) b.dataset.lab = lab.textContent; lab.textContent = a ? S.rAgain : b.dataset.lab; }
  });
  // sections du morceau
  const ks = (concert ? concert.id + ":" + cIdx : song.id) + ":" + song.sections.length;
  if (ks !== rKeySecs) {
    rKeySecs = ks;
    $("rSecs").innerHTML = song.sections.map((s, i) => `<button data-i="${i}" style="background:${s.color}">${esc(s.name)}</button>`).join("");
    $("rSecs").querySelectorAll("button").forEach(b => b.onclick = () => {
      const s = song.sections[+b.dataset.i];
      sendCmd(rg.reh.on ? "loop" : "seek", barT(s.start_bar).toFixed(3), b);
    });
  }
  const rh = rg.reh, inLoop = s => rh.on && rh.a != null && barT(s.start_bar) >= rh.a - 0.05 &&
    (s.end_bar != null ? barT(s.end_bar + 1) : barT(s.start_bar)) <= rh.b + 0.05;
  $("rSecs").querySelectorAll("button").forEach(b => {
    b.classList.toggle("cur", +b.dataset.i === si);
    b.classList.toggle("inloop", !!inLoop(song.sections[+b.dataset.i]));
  });
  // répétition
  $("rMixT").textContent = S.rMix;
  renderMix();
  $("rMix").querySelectorAll("button").forEach(b => b.classList.toggle("armed", !!(rg.armed && rg.armed.el === b)));
  $("rRehBtn").textContent = rh.on ? S.rRehOn : S.rReh;
  $("rRehBtn").classList.toggle("on", rh.on);
  document.querySelectorAll("#rReh .rx").forEach(b => { b.style.display = rh.on ? "" : "none"; });
  $("rLoopOff").textContent = S.rLoopOff;
  document.querySelectorAll("#rReh button.rate").forEach(b => {
    b.textContent = S.rRate(+b.dataset.rate); b.classList.toggle("on", rh.on && Math.abs(rh.rate - b.dataset.rate) < 0.001);
  });
  $("rRehB").textContent = rh.on ? S.rRehBanner(rh.names, rh.rate) : "";
  $("rRehB").classList.toggle("show", rh.on);
  $("rSecsT").textContent = rh.on ? S.rSecsReh : S.rSecs;
  // setlist
  const kl = concert ? concert.id : "";
  if (kl !== rKeyList) {
    rKeyList = kl;
    $("rListT").style.display = concert ? "" : "none";
    $("rList").innerHTML = concert ? concert.songs.map((s, i) => {
      const c = (s.sections.find(x => x.color && x.color.toLowerCase() !== "#787878") || s.sections[0] || {}).color || "#888";
      return `<button data-k="${i}"><i style="background:${c}"></i><span class="n">${i + 1}</span>${esc(s.title)}<span class="b">${Math.round(s.bpm)} BPM · ${mmss(s.stop_t - s.start_t)}</span></button>`;
    }).join("") : "";
    $("rList").querySelectorAll("button").forEach(b => b.onclick = () => {
      if (!confirmTap("song" + b.dataset.k, b)) return;
      sendCmd("song", +b.dataset.k + 1, b);
    });
  }
  $("rList").querySelectorAll("button").forEach(b => b.classList.toggle("cur", +b.dataset.k === cIdx));
  // délais / fenêtre Concert fermée
  for (const [n, p] of Object.entries(rg.pending)) if (now - p.at > 2500) {
    delete rg.pending[n]; p.el && p.el.classList.remove("sent");
    rWarn(S.rNoAnswer, true);
  }
  if (!DEMO && st.ok && (!rg.alive || now - rg.aliveAt > 3000) && !$("rWarn").classList.contains("bad"))
    rWarn(S.rOpenWin);
  else if (!DEMO && rg.alive && now - rg.aliveAt <= 3000 && $("rWarn").textContent === S.rOpenWin)
    rWarn("");
  if (!concert && !$("rWarn").classList.contains("show")) rWarn(S.rNoConcertHint);
  const pin = pinGet(); $("rFootL").textContent = pin ? S.rPin(pin) : S.rNoPin;
}

function showMsg(t) { $("msg").textContent = t; $("msg").classList.add("show"); }
function hideMsg() { $("msg").classList.remove("show"); }

// ---------------------------------------------------------------- boucles
document.documentElement.lang = LANG;
applyStatic();
loadSong(); setInterval(loadSong, 2000);
(async function loop() { await poll(); setTimeout(loop, 80); })();
setInterval(() => { if (!DEMO && !st.ok && song) showMsg(S.noReaper); else if (song) hideMsg(); }, 1000);
layoutBeats(); requestAnimationFrame(render);
</script>
</body>
